[project]
name = "w2sg"
version = "0.1.0"
description = "Weak-to-strong generalization for retrieval and reranking: confidence-aware fine-tuning of a cross-encoder on ensembled weak labels"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "torch>=2.1",
    "transformers>=4.38",
    "sentence-transformers>=2.5",
    "beir>=2.0",
    "rank_bm25>=0.2.2",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
